<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueLib Catalogue | BlueCrest College Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>BlueLib Catalogue</h1>
    <p class="tagline">BlueCrest College Library</p>
  </header>

  <nav class="site-nav" aria-label="Main navigation">
    <ul>
      <li><a href="#catalogue">Catalogue</a></li>
      <li><a href="#add-book">Add Book</a></li>
    </ul>
  </nav>

  <main>
    <!-- Section 1: browse, search and filter books -->
    <section id="catalogue" class="panel">
      <h2>Browse Books</h2>

      <div class="controls">
        <div class="field">
          <label for="search">Search by title</label>
          <input type="search" id="search" placeholder="Type a book title...">
        </div>
        <div class="field">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="All">All categories</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>
      </div>

      <p id="result-count" class="result-count" aria-live="polite"></p>
      <div id="book-list" class="book-grid"></div>
    </section>

    <!-- Section 2: add a new book -->
    <section id="add-book" class="panel">
      <h2>Add a New Book</h2>

      <form id="add-book-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title">
        </div>

        <div class="field">
          <label for="author">Author</label>
          <input type="text" id="author" name="author">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">-- Select a category --</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
            <option value="Science">Science</option>
            <option value="Arts">Arts</option>
          </select>
        </div>

        <div class="field">
          <label for="copies">Copies Available</label>
          <input type="number" id="copies" name="copies" min="0" step="1">
        </div>

        <p id="form-message" class="form-message" role="alert"></p>
        <button type="submit" class="btn">Add Book</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Ahiable Ephraim Kwame | 400622039170</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
